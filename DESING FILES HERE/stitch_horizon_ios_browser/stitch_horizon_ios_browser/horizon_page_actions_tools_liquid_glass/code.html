<script>
  // Simple micro-interactions for realistic feedback
  const copyBtn = document.getElementById('copyBtn');
  const copyText = document.getElementById('copyText');
  const copyIcon = document.getElementById('copyIcon');

  if (copyBtn) {
    copyBtn.addEventListener('click', () => {
      copyText.textContent = 'Link Copied!';
      copyIcon.textContent = 'check';
      copyIcon.classList.add('text-primary');
      setTimeout(() => {
        copyText.textContent = 'Copy Web Address';
        copyIcon.textContent = 'content_copy';
        copyIcon.classList.remove('text-primary');
      }, 1600);
    });
  }

  const readerBtn = document.getElementById('readerBtn');
  if (readerBtn) {
    readerBtn.addEventListener('click', () => {
      const container = readerBtn.firstElementChild;
      const label = readerBtn.lastElementChild;
      const isReaderActive = label.textContent.includes('Active');

      if (isReaderActive) {
        container.className = 'w-full aspect-square rounded-[20px] bg-surface-container-high/80 text-on-surface flex flex-col items-center justify-center shadow-[0_2px_8px_rgba(0,0,0,0.04),inset_0_1px_0.5px_rgba(255,255,255,0.8)] transition-all';
        label.textContent = 'Reader Mode';
        label.className = 'mt-space-xs font-caption text-caption text-on-surface-variant text-center';
        container.innerHTML = '<span class="material-symbols-outlined text-[24px]">chrome_reader_mode</span>';
      } else {
        container.className = 'relative w-full aspect-square rounded-[20px] bg-primary-container text-on-primary shadow-[0_4px_16px_rgba(0,112,235,0.35),inset_0_1px_1px_rgba(255,255,255,0.5)] flex flex-col items-center justify-center transition-all';
        label.textContent = 'Reader Active';
        label.className = 'mt-space-xs font-caption text-caption text-primary font-medium tracking-tight text-center';
        container.innerHTML = '<span class="material-symbols-outlined text-[24px]">chrome_reader_mode</span><span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-primary-fixed ring-2 ring-primary-container animate-pulse"></span>';
      }
    });
  }

  const doneBtn = document.getElementById('doneBtn');
  const closeSheet = document.getElementById('closeSheet');
  const dismissModal = () => {
    history.back();
  };

  if (doneBtn) doneBtn.addEventListener('click', dismissModal);
  if (closeSheet) closeSheet.addEventListener('click', dismissModal);
</script></main></body></html>
