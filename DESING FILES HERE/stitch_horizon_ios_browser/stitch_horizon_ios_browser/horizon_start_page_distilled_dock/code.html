<script>
    // Quick micro-interaction for Privacy Mode State Toggle
    const privacyBtn = document.getElementById('private-badge');
    let isPrivateMode = false;

    privacyBtn?.addEventListener('click', () => {
      isPrivateMode = !isPrivateMode;
      const dot = privacyBtn.querySelector('span:first-child');
      const text = privacyBtn.querySelector('span:last-child');
      
      if (isPrivateMode) {
        privacyBtn.classList.remove('bg-white/70', 'border-border-subtle');
        privacyBtn.classList.add('bg-black', 'text-white', 'border-black');
        dot.classList.remove('bg-emerald-500');
        dot.classList.add('bg-accent');
        text.textContent = 'Private';
        text.classList.remove('text-ink-secondary');
        text.classList.add('text-white');
      } else {
        privacyBtn.classList.add('bg-white/70', 'border-border-subtle');
        privacyBtn.classList.remove('bg-black', 'text-white', 'border-black');
        dot.classList.add('bg-emerald-500');
        dot.classList.remove('bg-accent');
        text.textContent = 'Protected';
        text.classList.add('text-ink-secondary');
        text.classList.remove('text-white');
      }
    });
  </script>
